# Optional PostgreSQL persistent job store overlay for HA / restart-persistence testing.
#
# Demonstrates Grafana OSS + LLM Dashboard Studio sharing a single PostgreSQL 16 instance
# (Grafana core tables in `public`, plugin job tables isolated in the `llm_studio` schema).
#
# Usage (from repository root):
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.postgres.yml up -d
#
# This overlay intentionally leaves deploy/docker-compose.yml untouched so single-instance
# default deployments remain zero-dependency in-memory.
services:
  grafana:
    environment:
      GF_DATABASE_TYPE: "postgres"
      GF_DATABASE_HOST: "postgres:5432"
      GF_DATABASE_NAME: "${GF_DATABASE_NAME:-grafana}"
      GF_DATABASE_USER: "${GF_DATABASE_USER:-grafana}"
      GF_DATABASE_PASSWORD: "${GF_DATABASE_PASSWORD:-grafana-dev-pass}"
      GF_DATABASE_SSL_MODE: "disable"
    volumes:
      - ./postgres/llm-studio-postgres.yml:/etc/grafana/provisioning/plugins/llm-studio-dev.yml:ro
    depends_on:
      prometheus:
        condition: service_started
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: "${GF_DATABASE_NAME:-grafana}"
      POSTGRES_USER: "${GF_DATABASE_USER:-grafana}"
      POSTGRES_PASSWORD: "${GF_DATABASE_PASSWORD:-grafana-dev-pass}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${GF_DATABASE_USER:-grafana} -d ${GF_DATABASE_NAME:-grafana}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
