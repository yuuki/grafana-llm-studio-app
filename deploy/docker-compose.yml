services:
  # ローカル開発・検証用構成（本番配備ではイメージを @sha256 ダイジェスト固定し、
  # 開発用プロビジョニングや sample-metrics を除外する）
  grafana:
    # 検証・サポート対象: 13.3.1 (React 19, 既定) または 12.4.15 (React 18)
    # 注: Grafana 12.4.0 以降 grafana/grafana-oss は更新終了のため、公式 OSS イメージ grafana/grafana を使用する
    image: grafana/grafana:${GRAFANA_VERSION:-13.3.1}
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # 未署名 Custom App Plugin は対象 ID のみを明示許可する
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: "yuuki-llmstudio-app"
      GF_SECURITY_ADMIN_USER: "${GF_SECURITY_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GF_SECURITY_ADMIN_PASSWORD:-change-me-local-dev}"
      # 閉域網で外部通信を完全に抑止する Grafana オフライン設定
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PUBLIC_KEY_RETRIEVAL_DISABLED: "true"
      GF_PLUGINS_PLUGIN_ADMIN_ENABLED: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
    volumes:
      - ../dist:/var/lib/grafana/plugins/yuuki-llmstudio-app:ro
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      # 注意: provisioning/plugins/llm-studio-dev.yaml は開発・モック検証専用。本番閉域環境ではマウントしない。
      - ./grafana/provisioning/plugins:/etc/grafana/provisioning/plugins:ro
      # 実 LLM 接続テスト時はオフライン搬入した grafana-llm-app を以下へマウントする:
      # (Grafana 13.3.1 の場合は v1.2.0、Grafana 12.4.15 の場合は v1.0.8)
      # - ./offline-plugins/grafana-llm-app:/var/lib/grafana/plugins/grafana-llm-app:ro
    depends_on:
      - prometheus

  prometheus:
    image: prom/prometheus:v3.16.0
    ports:
      - "127.0.0.1:9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--query.timeout=15s"
      - "--query.max-concurrency=10"
      - "--query.max-samples=10000000"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - sample-metrics

  # ローカル開発・検証用サンプルメトリクス（RED + リソースメトリクスを /metrics で公開）
  sample-metrics:
    image: python:3.12-slim
    working_dir: /app
    command: ["python3", "/app/exporter.py"]
    volumes:
      - ./prometheus/exporter.py:/app/exporter.py:ro
    ports:
      - "127.0.0.1:9108:9108"
