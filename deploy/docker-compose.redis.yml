# Optional Redis persistent job store overlay for HA / restart-persistence testing.
#
# Usage (from repository root):
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.redis.yml up -d
#
# This overlay intentionally leaves deploy/docker-compose.yml untouched so single-instance
# default deployments remain zero-dependency in-memory.
services:
  grafana:
    volumes:
      - ./redis/llm-studio-redis.yml:/etc/grafana/provisioning/plugins/llm-studio-dev.yml:ro
    depends_on:
      prometheus:
        condition: service_started
      redis:
        condition: service_healthy

  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:6379:6379"
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
      - "--save"
      - "60"
      - "1"
      - "--maxmemory"
      - "128mb"
      - "--maxmemory-policy"
      - "noeviction"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  redis-data:
