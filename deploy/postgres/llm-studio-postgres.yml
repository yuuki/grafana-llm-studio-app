apiVersion: 1

apps:
  # Local HA PostgreSQL job store verification plugin config (dev/mock mode only).
  # Uses a dedicated schema (llm_studio) to isolate plugin tables when sharing Grafana's PostgreSQL DB.
  - type: yuuki-llmstudio-app
    org_id: 1
    disabled: false
    jsonData:
      allowedDatasourceUids:
        - prom-main
      llmMode: mock
      allowMockInDev: true
      grafanaUrl: http://localhost:3000
      modelTier: base
      maxPanels: 6
      maxRepairAttempts: 2
      maxOutputTokens: 2048
      llmTimeoutSeconds: 45
      jobDeadlineSeconds: 90
      maxConcurrentJobs: 4
      validationTimeoutSeconds: 10
      maxConcurrentQueries: 2
      jobStoreBackend: postgres
      jobTtlMinutes: 30
      postgresAddr: postgres:5432
      postgresDatabase: ${GF_DATABASE_NAME}
      postgresSchema: llm_studio
      postgresTablePrefix: llm_studio_
      postgresUsername: ${GF_DATABASE_USER}
      postgresSslMode: disable
    secureJsonData:
      postgresPassword: ${GF_DATABASE_PASSWORD}
