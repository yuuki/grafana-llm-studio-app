apiVersion: 1

# VictoriaMetrics datasource provisioned via Grafana's built-in Prometheus-type proxy
# with an explicit MetricsQL dialect pin in llm-studio-vm.yml (`vm-prom: metricsql`).
# When verifying the offline `victoriametrics-metrics-datasource` plugin, you may also
# add a datasource entry with `type: victoriametrics-metrics-datasource` (auto-detected
# as `metricsql` without needing an explicit pin).
datasources:
  - name: VictoriaMetrics (MetricsQL)
    type: prometheus
    uid: vm-prom
    access: proxy
    url: http://victoriametrics:8428
    isDefault: false
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: "15s"
