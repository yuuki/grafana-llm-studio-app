name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly: runs the long fuzzing pass and catches toolchain/dependency drift.
    - cron: '23 19 * * 4'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26.13.0'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      # JSON Schema <-> TypeScript <-> Go enums, and the go-openai subset of JSON Schema.
      - name: Schema sync
        run: npm run verify:schemas

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:ci

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Vet
        run: make vet

      - name: Test (race)
        run: make test-race

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.15.0 # same as GOLANGCI_LINT_VERSION in the Makefile
          args: ./pkg/... ./cmd/...

      - name: go.mod tidiness
        run: go mod tidy -diff

  # Builds the plugin once for the E2E matrix.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26.13.0'
          cache: 'npm'

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Install npm dependencies
        run: npm ci

      # Frontend bundle with its externals check, and the linux/amd64 backend.
      - name: Build plugin
        run: make build

      - name: Build llm-bench
        run: make build-bench

      - name: Validate Docker Compose configurations
        run: |
          docker compose -f deploy/docker-compose.yml config --quiet
          docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.bench-verify.yml config --quiet
          docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.redis.yml config --quiet
          docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.victoriametrics.yml config --quiet

      - name: Upload plugin build
        uses: actions/upload-artifact@v7.0.2
        with:
          name: plugin-dist
          path: dist/
          retention-days: 1

  e2e:
    name: e2e (Grafana ${{ matrix.grafana_version }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        grafana_version: ['13.3.1', '12.4.15'] # React 19 and React 18
    env:
      GRAFANA_VERSION: ${{ matrix.grafana_version }}
      GRAFANA_URL: http://127.0.0.1:3000
      # Local stack only: the same defaults as deploy/docker-compose.yml.
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: change-me-local-dev
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26.13.0'
          cache: 'npm'

      - name: Download plugin build
        uses: actions/download-artifact@v8.0.2
        with:
          name: plugin-dist
          path: dist/

      - name: Make the backend executable
        run: chmod +x dist/gpx_yuuki_llmstudio_app_linux_amd64

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start Grafana and Prometheus
        run: docker compose -f deploy/docker-compose.yml up -d

      - name: Wait for Grafana, the plugin backend and Prometheus
        run: node scripts/wait-for-stack.mjs

      - name: CallResource SSE flush and client-disconnect cancellation
        run: node scripts/verify-sse-callresource.mjs

      - name: Playwright (@grafana/plugin-e2e)
        run: npm run test:e2e

      - name: Docker Compose logs
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs --tail=200

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-report-grafana-${{ matrix.grafana_version }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Stop the stack
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FUZZTIME: ${{ github.event_name == 'schedule' && '3m' || '15s' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Fuzz
        run: make test-fuzz

      # A failing input is written to testdata/fuzz/; keep it so it can be
      # committed as a regression seed.
      - name: Upload failing fuzz inputs
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: fuzz-failing-inputs
          path: '**/testdata/fuzz/**'
          retention-days: 30

  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # actionlint and gh-actions-lock run through `go run`.
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: actionlint, zizmor and actions.lock
        run: make lint-actions
        env:
          # Enables zizmor's online audits (read-only API calls).
          GH_TOKEN: ${{ github.token }}
